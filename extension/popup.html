<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FileSanity</title>
<style>
  body { margin: 0; width: 260px; padding: 16px; font: 14px/1.45 system-ui, sans-serif; color: #1a1a19; background: #f1f1ef; }
  h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  p { margin: 0 0 12px; color: #5f5f5c; }
  label { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid #d9d9d5; }
  input { width: 18px; height: 18px; accent-color: #d9541e; }
  .n { border-top: 1px solid #d9d9d5; padding-top: 10px; font-variant-numeric: tabular-nums; }
  a { color: inherit; }
</style>
</head>
<body>
<h1>FileSanity</h1>
<p>Files you choose for upload are cleaned first, in this browser.</p>
<label>Clean before upload <input type="checkbox" id="enabled"></label>
<div class="n"><span id="count">0</span> <span id="unit">files</span> cleaned so far</div>
<p style="margin-top:12px"><a href="https://filesanity.com/formats" target="_blank" rel="noopener">What it removes</a></p>
<script src="popup.js"></script>
</body>
</html>
