name: Bug report
description: The cleaner missed metadata, broke a file, or a page misbehaves.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach files with real personal data. For security problems use SECURITY.md instead.
  - type: input
    id: format
    attributes:
      label: File type
      placeholder: JPEG from an iPhone 15, DOCX from Word 365, PDF from Acrobat...
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and system
      placeholder: Firefox 131 on Windows 11
