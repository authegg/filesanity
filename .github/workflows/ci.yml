name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg ghostscript
      - run: pip install pillow pillow-heif python-docx openpyxl python-pptx pypdf pikepdf mutagen
      - run: python3 tests/lib.py
